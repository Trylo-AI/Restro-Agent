# Merge to main → build the image once (tag = commit SHA) → migrate the staging DB → deploy api + worker with the
# same digest → console to Firebase Hosting → smoke test (docs/architecture.md#deploy). From Phase 3: nothing runs
# until the repository variable DEPLOY_ENABLED is "true". Auth is Workload Identity Federation; no keys anywhere.
name: deploy-staging

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging  # vars: GCP_PROJECT, WIF_PROVIDER, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, CONSOLE_ORIGIN
                          # secret: SUPABASE_DB_URL (migrations only)
    env:
      REGION: asia-south1
      PROJECT: ${{ vars.GCP_PROJECT }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ci-deployer-sa@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image (once per commit)
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/restro/backend"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f backend/Dockerfile --build-arg GIT_SHA="$SHA" -t "$IMAGE:$SHA" .
          docker push "$IMAGE:$SHA"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE:$SHA" --format='value(image_summary.digest)')"
          echo "IMAGE_REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Migrate the staging DB (backward compatible, before the deploy)
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy worker, then api (same digest)
        run: |
          SA_SUFFIX="$PROJECT.iam.gserviceaccount.com"
          COMMON="APP_ENV=staging,GIT_SHA=$SHA,SUPABASE_URL=${{ vars.SUPABASE_URL }},GCP_PROJECT=$PROJECT"
          COMMON="$COMMON,LLM_BACKEND=vertex,WA_TRANSPORT=meta,SIGNAL_BACKEND=pubsub,TASKS_BACKEND=cloud_tasks"
          COMMON="$COMMON,INTERNAL_AUTH=oidc,SECRETS_BACKEND=gcp,GCP_INVOKER_SA=invoker-sa@$SA_SUFFIX"
          DB="SUPABASE_SECRET_KEY=supabase-service-key:latest,DATABASE_URL=supabase-db-url:latest,DATABASE_URL_SESSION=supabase-db-url-session:latest"

          # worker: internal only, invoked by invoker-sa; never verifies webhooks, so it gets no Meta secrets.
          gcloud run deploy worker --image "$IMAGE_REF" --region "$REGION" --project "$PROJECT" \
            --service-account "worker-sa@$SA_SUFFIX" --ingress internal --no-allow-unauthenticated \
            --no-cpu-throttling --min-instances 0 --max-instances 3 --concurrency 40 --cpu-boost --timeout 60 \
            --set-env-vars "$COMMON,RESTRO_SERVICE=worker,META_APP_SECRET=unused-in-worker,META_VERIFY_TOKEN=unused-in-worker" \
            --set-secrets "$DB"
          WORKER_URL="$(gcloud run services describe worker --region "$REGION" --project "$PROJECT" --format='value(status.url)')"

          gcloud run deploy api --image "$IMAGE_REF" --region "$REGION" --project "$PROJECT" \
            --service-account "api-sa@$SA_SUFFIX" --ingress all --allow-unauthenticated \
            --min-instances 0 --max-instances 3 --concurrency 60 --cpu-boost --timeout 30 \
            --set-env-vars "^@^$(echo "$COMMON,RESTRO_SERVICE=api,WORKER_URL=$WORKER_URL" | tr ',' '@')@CORS_ORIGINS=${{ vars.CONSOLE_ORIGIN }}" \
            --set-secrets "$DB,META_APP_SECRET=meta-app-secret:latest,META_VERIFY_TOKEN=meta-verify-token:latest"
          echo "API_URL=$(gcloud run services describe api --region "$REGION" --project "$PROJECT" --format='value(status.url)')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and deploy the console (+ public pages)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx --yes firebase-tools@13 deploy --only hosting --project "$PROJECT" --non-interactive
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_URL: ${{ env.API_URL }}
          VITE_DEMO: "false"

      - name: Smoke test
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/healthz")" = 200
          # A wrong verify token must be refused: the webhook route is up and checks its secret.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/webhooks/whatsapp?hub.mode=subscribe&hub.verify_token=wrong&hub.challenge=1")" = 403
          # An unsigned webhook must be refused before any parsing.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' "$API_URL/webhooks/whatsapp")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.CONSOLE_ORIGIN }}/privacy.html")" = 200
          echo "Then by hand: one order on the test number (rules.md#dry-run)."
