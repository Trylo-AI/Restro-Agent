name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: ruff check .
      - run: mypy app
      - run: pytest -q -m "not integration"

  backend-integration:
    runs-on: ubuntu-latest
    if: hashFiles('supabase/config.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock && pip install -e backend --no-deps
      # Exit code 5 = no tests collected yet.
      - run: pytest -q -m integration || [ $? -eq 5 ]
        working-directory: backend

  spa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
