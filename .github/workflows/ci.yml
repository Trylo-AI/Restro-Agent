name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - run: ruff check .
      - run: mypy app
      - run: pytest -q -m "not integration"
      - run: python ../evals/run.py --purpose recommend --stub

  backend-integration:
    runs-on: ubuntu-latest
    if: hashFiles('supabase/config.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Export local stack settings (synthetic, CI only)
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "APP_ENV=test"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "DATABASE_URL_SESSION=$DB_URL"
            echo "META_APP_SECRET=ci-app-secret"
            echo "META_VERIFY_TOKEN=ci-verify-token"
            echo "SEED_STAFF_PASSWORD=ci-staff-password-1"
            echo "RLS_SUPABASE_URL=$API_URL"
            echo "RLS_PUBLISHABLE_KEY=$ANON_KEY"
            echo "RLS_PASSWORD=ci-staff-password-1"
            echo "INTEGRATION_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.lock && pip install -e backend --no-deps
      - run: python supabase/seed/generate.py --live
      - run: python scripts/check_contracts.py
      # Exit code 5 = no tests collected yet.
      - run: pytest -q -m integration || [ $? -eq 5 ]
        working-directory: backend

  spa:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # gcloud scripts against a fake gcloud with DRY_RUN=1: create and update paths, nothing real is called.
      - run: bash infra/test/dry_run.sh
      # The image builds from the repo root and finds contracts/ next to backend/.
      - run: docker build -f backend/Dockerfile -t restro-backend:ci .
      - run: >
          docker run --rm -e RESTRO_SERVICE=worker restro-backend:ci python -c
          "import app.domain.ai_agent.calls as c, app.domain.ai_agent.guardrails as g;
          assert c.SCHEMA_FILE.exists() and g.ALLERGENS_FILE.exists()"
