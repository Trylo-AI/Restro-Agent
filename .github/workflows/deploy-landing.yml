# Public website (landing page + privacy, terms, about, data deletion) → GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions". Optional repo variable CONSOLE_URL
# (Settings → Secrets and variables → Actions → Variables) turns on the "Log in" links.
name: deploy-landing

on:
  push:
    branches: [main]
    paths:
      - frontend/site/**
      - frontend/public/**
      - frontend/src/features/landing/**
      - frontend/src/styles/tokens.css
      - frontend/vite.landing.config.ts
      - frontend/package-lock.json
      - .github/workflows/deploy-landing.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run src/public-pages.test.ts
      - run: npm run build:landing
        env:
          VITE_CONSOLE_URL: ${{ vars.CONSOLE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-landing

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
