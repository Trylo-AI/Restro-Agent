openapi: 3.1.0
info:
  title: Restro api
  version: 0.1.0
  description: |
    Console and webhook REST API (docs/data-and-api.md#api). Contract: change only in a PR that updates
    backend, console and docs together.

    Reads go through Supabase (RLS + Realtime), except `/audit/*`, `/orders/{id}/history`, `/offers/lookup`,
    `/bills/*`, `/consents/export`, `/campaigns/{id}/recipients/export` and the audience preview; every write is one
    of these endpoints.
    Every console call sends `Authorization: Bearer <Supabase JWT>` and `X-Cafe-Id` (picks among the caller's
    own memberships; the resource's café wins and a mismatch is 403). No endpoint accepts `cafe_id` in a body
    or query string. Money is integer paise. Every write returns the changed row and writes one `audit_log` row.
    Set-state calls are no-ops (200, no second audit row or message) when the value is already set.

    Local-only routes (`/dev/sim/*`, simulator) and worker routes (`/internal/*`) are not part of this contract.
servers:
  - url: http://localhost:8000
    description: local api

security:
  - bearer: []

tags:
  - name: orders
  - name: requests
  - name: conversations
  - name: menu
  - name: cafes
  - name: customers
  - name: notifications
  - name: campaigns
  - name: offers
  - name: audit
  - name: telemetry
  - name: webhooks

paths:
  /orders/{id}/transition:
    post:
      tags: [orders]
      summary: Accept, Mark ready, Mark served (shift_manager+)
      description: Customer message is queued for +5 s so Undo can stop it. Audit `order.transition`.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [to, expected_version]
              properties:
                to: { type: string, enum: [ACCEPTED, READY, SERVED] }
                expected_version: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrderConflict" }
        "422": { $ref: "#/components/responses/Error" }

  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: Staff cancel with reason (shift_manager+ while NEW; manager+ from ACCEPTED or READY)
      description: |
        `reason_text` is required for `other`, shown to staff only, never sent to the customer or the LLM.
        Queues the AI-drafted customer message at +5 s; writes one `notifications` row per active manager and owner.
        Audit `order.cancel`.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code, expected_version]
              properties:
                reason_code: { type: string, enum: [out_of_stock, kitchen_issue, customer_asked, other] }
                reason_text: { type: [string, "null"], maxLength: 120 }
                expected_version: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/OrderConflict" }
        "422": { $ref: "#/components/responses/Error" }

  /orders/{id}/undo:
    post:
      tags: [orders]
      summary: Revert the caller's last transition within 5 s
      description: The queued customer message is never sent. 422 `invalid_transition` after 5 s or for another actor. Audit `order.undo`.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /orders/{id}/delay:
    post:
      tags: [orders]
      summary: Delay an order (NEW or ACCEPTED) and tell the customer at once
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [minutes]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 99 }
                note: { type: [string, "null"], maxLength: 120 }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /orders/manual:
    post:
      tags: [orders]
      summary: Manual order (offline fallback), priced by code, created ACCEPTED, no customer messages
      parameters:
        - { $ref: "#/components/parameters/CafeId" }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 80 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [table_id, items]
              properties:
                table_id: { type: string, format: uuid }
                items:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    type: object
                    additionalProperties: false
                    required: [item_id, qty]
                    properties:
                      item_id: { type: string, format: uuid }
                      qty: { type: integer, minimum: 1, maximum: 20 }
                      note: { type: [string, "null"], maxLength: 120 }
                allergy_note: { type: [string, "null"], maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/Order" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /requests/{id}/ack:
    post:
      tags: [requests]
      summary: Acknowledge a help, allergy or bill request (low_rating needs manager+)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { $ref: "#/components/responses/Request" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /requests/{id}/resolve:
    post:
      tags: [requests]
      summary: Resolve a request; resolving help or allergy hands the chat back to the bot
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { $ref: "#/components/responses/Request" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /bills/{table_session_id}/deliver:
    post:
      tags: [requests]
      summary: Bill delivered — resolve the bill request and close the table session
      parameters:
        - { name: table_session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CafeId" }
      responses:
        "200":
          description: Closed session and its bill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "404": { $ref: "#/components/responses/Error" }

  /conversations/{id}/takeover:
    post:
      tags: [conversations]
      summary: Human mode, assigned to the caller
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { $ref: "#/components/responses/Conversation" }
        "404": { $ref: "#/components/responses/Error" }

  /conversations/{id}/reply:
    post:
      tags: [conversations]
      summary: Staff reply through the send layer; takes over from bot mode
      description: 409 `window_closed` when the customer's last message is older than 24 h.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/Conversation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /conversations/{id}/handback:
    post:
      tags: [conversations]
      summary: Back to bot mode
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { $ref: "#/components/responses/Conversation" }
        "404": { $ref: "#/components/responses/Error" }

  /conversations/open:
    post:
      tags: [conversations]
      summary: Message a table — open the table session's chat in human mode
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [table_session_id]
              properties:
                table_session_id: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Conversation" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /menu/{id}/availability:
    post:
      tags: [menu]
      summary: Sold-out toggle (shift_manager+)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [available]
              properties:
                available: { type: boolean }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItem" }
        "404": { $ref: "#/components/responses/Error" }

  /cafes/{id}/pause-ordering:
    post:
      tags: [cafes]
      summary: Pause or resume WhatsApp ordering (manager+)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paused]
              properties:
                paused: { type: boolean }
      responses:
        "200":
          description: Café settings after the change
          content:
            application/json:
              schema:
                type: object
                required: [id, settings]
                properties:
                  id: { type: string, format: uuid }
                  settings: { type: object }
        "403": { $ref: "#/components/responses/Error" }

  /customers/{id}/notes:
    post:
      tags: [customers]
      summary: Add a staff comment; the worker applies the AI's profile changes
      description: Returns the note with `ai_status = pending`; the result arrives by Realtime. Audit `customer.note`.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/CustomerNote" }
        "404": { $ref: "#/components/responses/Error" }

  /customer-notes/{id}/undo:
    post:
      tags: [customers]
      summary: Reverse a comment's applied profile changes
      description: 409 `version_conflict` when a later comment changed the same value. Audit `customer.profile_undo`.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { $ref: "#/components/responses/CustomerNote" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /customers/{id}/preferences/remove:
    post:
      tags: [customers]
      summary: Remove one profile value (the chip ×)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, value]
              properties:
                kind: { $ref: "#/components/schemas/PreferenceKind" }
                value: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "200":
          description: The customer's preferences after the change
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Preference" }
        "404": { $ref: "#/components/responses/Error" }

  /notifications/{id}/ack:
    post:
      tags: [notifications]
      summary: Mark one of the caller's notifications read (manager+)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { description: Marked read }
        "404": { $ref: "#/components/responses/Error" }

  /notifications/ack-all:
    post:
      tags: [notifications]
      summary: Mark all of the caller's notifications read (manager+)
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { description: Marked read }

  /telemetry/console:
    post:
      tags: [telemetry]
      summary: Console connection events, recorded as metrics only
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, at]
                    properties:
                      kind: { type: string, enum: [realtime_disconnect, realtime_reconnect, offline_banner] }
                      at: { type: string, format: date-time }
      responses:
        "204": { description: Recorded }

  /bills/{table_session_id}:
    get:
      tags: [requests]
      summary: Bill sheet for a table session, totals computed by code (shift_manager+)
      parameters:
        - { name: table_session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CafeId" }
      responses:
        "200":
          description: The bill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "404": { $ref: "#/components/responses/Error" }

  /bills/{table_session_id}/apply-code:
    post:
      tags: [requests]
      summary: Redeem a campaign code on this bill (shift_manager+). Audit `offer.redeem`
      description: |
        One code per bill, one redemption per code. Applying the code already on this session is a 200 no-op.
        422 `invalid_code` "This isn't a valid code, or it has expired."; 409 `code_already_used` "This code was
        already used today on #1041."
        Eligibility is the same check as `POST /offers/lookup` / `POST /offers/redeem`; 422 carries
        `error.details.verdict`; 409 carries the earlier redemption in `error.details`. Records `channel = table_bill`
        and `bill_paise` = the subtotal at redemption.
      parameters:
        - { name: table_session_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CafeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 3, maxLength: 20 }
      responses:
        "200":
          description: Bill with the discount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bill" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /offers/lookup:
    post:
      tags: [offers]
      summary: Find a customer's offer codes and whether each can be redeemed now (shift_manager+). Read only, no audit
      description: |
        `q` is a name (matched anywhere), exactly the last 4 digits of the number, or a code (any case). POST so the search
        text never lands in URLs or logs. This café only; deleted customers found only by code. ≤ 20 customers, eligible
        first; ≤ 10 offers each, newest first. Same verdict as `POST /offers/redeem` and apply-code. Never a full number.
        400 "Type the last 4 digits of the number." for 1–3 or 5+ digits.
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [q], properties: { q: { type: string, minLength: 2, maxLength: 40 } } }
      responses:
        "200": { description: Matching customers and offers, content: { application/json: { schema: { $ref: "#/components/schemas/OfferLookup" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /offers/redeem:
    post:
      tags: [offers]
      summary: Redeem a code at the counter against the amount paid (shift_manager+). Audit `offer.redeem` (channel counter)
      description: |
        Discount = the campaign's `discount_percent` of `bill_paise`, rounded down; 0 without a percentage. `Idempotency-Key`
        required: same key → same redemption (200, no second audit row); same key with another code → 400.
        422 `invalid_code` (`details.verdict`: not_found, expired, campaign_cancelled, not_sent, not_delivered);
        409 `code_already_used` (`details`: redeemed_at, channel, redeemed_by_name, order_number, table_label);
        409 `already_redeemed_this_visit` when this customer redeemed another code in the last 60 minutes.
      parameters:
        - { $ref: "#/components/parameters/CafeId" }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 80 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CounterRedeemInput" } } } }
      responses:
        "200": { description: The redemption and the amount to collect, content: { application/json: { schema: { $ref: "#/components/schemas/CounterRedemption" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /menu:
    post:
      tags: [menu]
      summary: New menu item (manager+). Audit `menu.update`
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuItemInput" }
      responses:
        "200":
          description: Created item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItemFull" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /menu/{id}:
    put:
      tags: [menu]
      summary: Edit a menu item with optimistic locking (manager+). Audit `menu.update`
      description: 409 `version_conflict` "Someone else changed this item"; a name already on the menu is 400.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/MenuItemInput" }
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MenuItemFull" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /menu/import:
    post:
      tags: [menu]
      summary: CSV import, all or nothing (owner). Audit `menu.import`
      description: |
        Columns: name, category, price (rupees), prep_minutes, veg (yes/no) required; description, spice,
        contains, free_from (allergen ids separated by `;`), available optional. Rows match by name
        (case-insensitive): update matches, insert new, leave missing items alone; unlisted allergens stay
        `unknown`. Any invalid row rejects the file: 400 with `details.rows`.
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        description: The CSV file's text, UTF-8, at most 1 MB and 500 rows
        content:
          text/csv:
            schema: { type: string }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [created, updated]
                properties:
                  created: { type: integer }
                  updated: { type: integer }
        "400":
          description: Rejected file; `error.details.rows` = [{row, column, message}]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cafes/{id}/settings:
    put:
      tags: [cafes]
      summary: Opening hours, cutoff, tone, feedback delay, alert number in one save (owner). Audit `settings.update`
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CafeSettings" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CafeSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /tables:
    post:
      tags: [cafes]
      summary: New table; `qr_text` is "Hi, I'm at Table <label>" (owner). Audit `table.update`
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TableInput" }
      responses:
        "200":
          description: Created table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "409": { $ref: "#/components/responses/Error" }

  /tables/{id}:
    put:
      tags: [cafes]
      summary: Edit a table (owner). Audit `table.update`
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TableInput" }
      responses:
        "200":
          description: Updated table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /team/invite:
    post:
      tags: [cafes]
      summary: Invite by email with a role; sends the Supabase Auth invite (owner). Audit `team.invite`
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 200 }
                role: { type: string, enum: [shift_manager, manager, owner] }
                display_name: { type: [string, "null"], maxLength: 40 }
      responses:
        "200":
          description: The membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "409": { $ref: "#/components/responses/Error" }

  /team/{membership_id}:
    patch:
      tags: [cafes]
      summary: Change role or deactivate; effective on the next request (owner). Audit `team.update`
      description: Owner rows can't be deactivated; the last active owner can't be demoted (400).
      parameters:
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CafeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [shift_manager, manager, owner] }
                active: { type: boolean }
      responses:
        "200":
          description: The membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /customers/{id}/delete:
    post:
      tags: [customers]
      summary: Delete a customer's data (owner). Audit `customer.delete`
      description: See docs/architecture.md#data-protection. Orders keep their totals with the customer link removed.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200":
          description: Deletion request after processing
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, completed, failed] }
        "404": { $ref: "#/components/responses/Error" }

  /consents/export:
    get:
      tags: [customers]
      summary: CSV of the full consent history with masked numbers (owner). Audit `consent.export`
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }

  /campaigns:
    post:
      tags: [campaigns]
      summary: Create a draft (owner). Audit `campaign.draft`
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/Error" }

  /campaigns/{id}:
    put:
      tags: [campaigns]
      summary: Edit a draft (owner). Audit `campaign.draft`
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignInput" }
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "422": { $ref: "#/components/responses/Error" }

  /campaigns/audience-preview:
    post:
      tags: [campaigns]
      summary: Who would receive it, the daily limit and days needed (owner)
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [segment, template_name]
              properties:
                segment: { type: string, enum: [all_opted_in, lapsed, regulars] }
                template_name: { type: string }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudiencePreview" }

  /campaigns/{id}/schedule:
    post:
      tags: [campaigns]
      summary: draft → scheduled (owner). Audit `campaign.schedule`
      description: 422 when no approved marketing template, no recipients, a past time or a disconnected number.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scheduled_at]
              properties:
                scheduled_at: { type: string, format: date-time }
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "422": { $ref: "#/components/responses/Error" }

  /campaigns/{id}/cancel:
    post:
      tags: [campaigns]
      summary: scheduled or sending → cancelled; queued recipients are not sent (owner). Audit `campaign.cancel`
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200":
          description: The campaign
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "422": { $ref: "#/components/responses/Error" }

  /campaigns/{id}/recipients/export:
    get:
      tags: [campaigns]
      summary: CSV of a campaign's recipients and what happened, masked numbers (owner). Audit `campaign.export`
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /audit/entries:
    get:
      tags: [audit]
      summary: Staff actions in this café, newest first (owner)
      description: |
        Severity, label, category and a sentence rendered by `domain/audit/catalog.py`. No `from` → last 7 days, unless an
        order, customer or conversation filter is set (then all time). Range ≤ 366 days. `q`: "#42"/"42" = order number;
        otherwise staff name, customer first name, dish or table name, action label. Keyset paging: pass `next` as `before`.
        `action` also takes the filter-only actions `order.accept`, `order.ready` and `order.serve` (stored as
        `order.transition` with that `change.to`; never written).
      parameters:
        - { $ref: "#/components/parameters/CafeId" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditCategoryQ" }
        - { $ref: "#/components/parameters/AuditSeverityQ" }
        - { $ref: "#/components/parameters/AuditActorId" }
        - { $ref: "#/components/parameters/AuditRole" }
        - { $ref: "#/components/parameters/AuditOrderNumber" }
        - { $ref: "#/components/parameters/AuditOrderId" }
        - { $ref: "#/components/parameters/AuditCustomerId" }
        - { $ref: "#/components/parameters/AuditConversationId" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
        - { $ref: "#/components/parameters/AuditQ" }
        - { name: before, in: query, schema: { type: string, maxLength: 120 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200": { description: One page, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /audit/facets:
    get:
      tags: [audit]
      summary: Counts for the filter dropdowns and summary strip, for a date range (owner)
      parameters: [{ $ref: "#/components/parameters/CafeId" }, { $ref: "#/components/parameters/AuditFrom" }, { $ref: "#/components/parameters/AuditTo" }]
      responses:
        "200": { description: Facets, content: { application/json: { schema: { $ref: "#/components/schemas/AuditFacets" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /audit/catalog:
    get:
      tags: [audit]
      summary: Action labels, categories, roles and severity rules (owner). Static per deploy
      parameters: [{ $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { description: Catalogue, content: { application/json: { schema: { $ref: "#/components/schemas/AuditCatalog" } } } }
        "403": { $ref: "#/components/responses/Error" }

  /audit/export:
    get:
      tags: [audit]
      summary: CSV of the filtered audit log, ≤ 10 000 rows (owner). Audit `audit.export`
      description: Same filters as /audit/entries. 400 "Too many rows — narrow the dates or filters." over the cap.
      parameters:
        - { $ref: "#/components/parameters/CafeId" }
        - { $ref: "#/components/parameters/AuditAction" }
        - { $ref: "#/components/parameters/AuditCategoryQ" }
        - { $ref: "#/components/parameters/AuditSeverityQ" }
        - { $ref: "#/components/parameters/AuditActorId" }
        - { $ref: "#/components/parameters/AuditRole" }
        - { $ref: "#/components/parameters/AuditOrderNumber" }
        - { $ref: "#/components/parameters/AuditOrderId" }
        - { $ref: "#/components/parameters/AuditCustomerId" }
        - { $ref: "#/components/parameters/AuditConversationId" }
        - { $ref: "#/components/parameters/AuditFrom" }
        - { $ref: "#/components/parameters/AuditTo" }
        - { $ref: "#/components/parameters/AuditQ" }
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /orders/{id}/history:
    get:
      tags: [orders, audit]
      summary: One order's full timeline — customer, staff, automatic events, escalations, bill and code (owner)
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/CafeId" }]
      responses:
        "200": { description: Timeline, oldest first, content: { application/json: { schema: { $ref: "#/components/schemas/OrderHistory" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /webhooks/whatsapp:
    get:
      tags: [webhooks]
      summary: Meta verification handshake
      security: []
      parameters:
        - { name: hub.mode, in: query, schema: { type: string } }
        - { name: hub.verify_token, in: query, schema: { type: string } }
        - { name: hub.challenge, in: query, schema: { type: string } }
      responses:
        "200": { description: Echoes hub.challenge, content: { text/plain: { schema: { type: string } } } }
        "403": { description: Wrong verify token }
    post:
      tags: [webhooks]
      summary: Meta webhook (messages, statuses, account events)
      description: X-Hub-Signature-256 checked on raw bytes before parsing. Always 200 within 300 ms once stored.
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Stored }
        "401": { description: Bad signature; nothing stored }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CafeId:
      name: X-Cafe-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    AuditAction:
      name: action
      in: query
      style: form
      explode: true
      description: Stored actions, plus the filter-only `order.accept`, `order.ready` and `order.serve` (never written)
      schema: { type: array, maxItems: 40, items: { type: string, pattern: "^[a-z_]+\\.[a-z_]+$" } }
    AuditCategoryQ:      { name: category, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AuditCategory" } } }
    AuditSeverityQ:      { name: severity, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AuditSeverity" } } }
    AuditActorId:        { name: actor_id, in: query, style: form, explode: true, schema: { type: array, maxItems: 20, items: { type: string, format: uuid } } }
    AuditRole:           { name: role, in: query, style: form, explode: true, schema: { type: array, items: { $ref: "#/components/schemas/AuditActorRole" } } }
    AuditOrderNumber:    { name: order_number, in: query, schema: { type: integer, minimum: 1 } }
    AuditOrderId:        { name: order_id, in: query, schema: { type: string, format: uuid } }
    AuditCustomerId:     { name: customer_id, in: query, schema: { type: string, format: uuid }, description: "Includes the customer's chat rows" }
    AuditConversationId: { name: conversation_id, in: query, schema: { type: string, format: uuid } }
    AuditFrom:           { name: from, in: query, schema: { type: string, format: date-time } }
    AuditTo:             { name: to, in: query, schema: { type: string, format: date-time }, description: Exclusive }
    AuditQ:              { name: q, in: query, schema: { type: string, maxLength: 60 } }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OrderConflict:
      description: 409 version_conflict; `error.details.current` is the order as it is now
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Order:
      description: Order after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Order" }
    Request:
      description: Request after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Request" }
    Conversation:
      description: Conversation after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Conversation" }
    CustomerNote:
      description: Note after the change
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CustomerNote" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthenticated, forbidden, not_found, version_conflict, code_already_used,
                     window_closed, invalid_transition, invalid_code, rate_limited, internal,
                     already_redeemed_this_visit]
            message: { type: string, description: Safe to show to staff }
            details: { type: object }

    OrderStatus: { type: string, enum: [NEW, ACCEPTED, READY, SERVED, CANCELLED] }

    Order:
      type: object
      required: [id, number, status, flags, version, total_paise, expected_minutes, delay_minutes, source, created_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer }
        status: { $ref: "#/components/schemas/OrderStatus" }
        flags:
          type: array
          items: { type: string, enum: [escalated, overdue, delayed, edited, item_sold_out, near_closing] }
        version: { type: integer }
        customer_id: { type: [string, "null"], format: uuid }
        table_session_id: { type: [string, "null"], format: uuid }
        allergy_note: { type: [string, "null"] }
        expected_minutes: { type: integer }
        delay_minutes: { type: integer }
        total_paise: { type: integer, description: Sum of lines; prices include GST }
        source: { type: string, enum: [qr, campaign, manual] }
        cancel_reason_code: { type: [string, "null"], enum: [out_of_stock, kitchen_issue, customer_asked, other, customer, null] }
        cancel_reason_text: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        ready_at: { type: [string, "null"], format: date-time }
        served_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        undo_until: { type: [string, "null"], format: date-time, description: Set after a staff transition; Undo works until then }

    Request:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [help, bill, allergy, low_rating] }
        status: { type: string, enum: [open, acknowledged, resolved] }
        reason_tag: { type: [string, "null"] }
        conversation_id: { type: [string, "null"], format: uuid }
        table_session_id: { type: [string, "null"], format: uuid }
        acknowledged_by: { type: [string, "null"], format: uuid }
        acknowledged_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }

    Conversation:
      type: object
      required: [id, mode]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        mode: { type: string, enum: [bot, human] }
        assigned_to: { type: [string, "null"], format: uuid }
        table_session_id: { type: [string, "null"], format: uuid }

    Bill:
      type: object
      required: [table_session_id, orders, total_paise]
      properties:
        table_session_id: { type: string, format: uuid }
        closed_at: { type: [string, "null"], format: date-time }
        orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              number: { type: integer }
              total_paise: { type: integer }
              items:
                type: array
                items:
                  type: object
                  properties:
                    name_snapshot: { type: string }
                    qty: { type: integer }
                    line_paise: { type: integer }
        subtotal_paise: { type: integer }
        code: { type: [string, "null"] }
        discount_paise: { type: integer, default: 0 }
        total_paise: { type: integer, description: "Total (incl. GST)" }

    MenuItem:
      type: object
      required: [id, name, available, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        available: { type: boolean }
        version: { type: integer }

    PreferenceKind: { type: string, enum: [diet, milk, sugar, spice, seating, allergy, dislike, like, other] }

    Preference:
      type: object
      required: [id, kind, value, source]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PreferenceKind" }
        value: { type: string }
        source: { type: string, enum: [chat, staff_note] }
        note_id: { type: [string, "null"], format: uuid }

    CustomerNote:
      type: object
      required: [id, customer_id, text, ai_status, ai_ops, created_at]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        text: { type: string }
        ai_status: { type: string, enum: [pending, applied, no_changes, failed] }
        ai_ops:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [set, add, remove] }
              kind: { $ref: "#/components/schemas/PreferenceKind" }
              value: { type: string }
              previous: { type: [string, "null"] }
        ai_summary: { type: [string, "null"] }
        undone_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Allergen:
      type: string
      enum: [gluten, milk, eggs, peanuts, tree_nuts, soy, sesame, fish, shellfish, mustard, sulphites]

    MenuItemInput:
      type: object
      additionalProperties: false
      required: [name, category, price_paise, prep_minutes, veg]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, "null"], maxLength: 200 }
        category: { type: string, minLength: 1, maxLength: 40 }
        price_paise: { type: integer, minimum: 1 }
        prep_minutes: { type: integer, minimum: 1, maximum: 120 }
        veg: { type: boolean }
        spice: { type: integer, minimum: 0, maximum: 3, default: 0 }
        available: { type: boolean, default: true }
        allergens:
          type: array
          description: States not listed stay `unknown`
          items:
            type: object
            required: [allergen, state]
            properties:
              allergen: { $ref: "#/components/schemas/Allergen" }
              state: { type: string, enum: [contains, free_from, unknown] }

    MenuItemFull:
      allOf:
        - { $ref: "#/components/schemas/MenuItemInput" }
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }

    CafeSettings:
      type: object
      additionalProperties: false
      properties:
        opening_hours:
          type: object
          description: '{"mon": [["08:00","23:00"]], ...}; mon–sun, up to 3 windows a day; an end before the start runs past midnight; empty = always open'
          additionalProperties:
            type: array
            maxItems: 3
            items:
              type: array
              minItems: 2
              maxItems: 2
              items: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cutoff_minutes: { type: integer, minimum: 0, maximum: 180 }
        tone: { type: string, enum: [warm, crisp, playful] }
        feedback_delay_minutes: { type: integer, enum: [15, 30, 60] }
        alert_phone: { type: [string, "null"], pattern: '^\+?[0-9]{10,15}$', description: Café alert number (new_order_alert) }

    TableInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 20 }
        area: { type: [string, "null"], maxLength: 40 }
        seats: { type: [integer, "null"], minimum: 1, maximum: 50 }

    Table:
      allOf:
        - { $ref: "#/components/schemas/TableInput" }
        - type: object
          required: [id, qr_text]
          properties:
            id: { type: string, format: uuid }
            qr_text: { type: string }

    Membership:
      type: object
      required: [id, user_id, role, active]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [shift_manager, manager, owner] }
        active: { type: boolean }
        display_name: { type: [string, "null"] }

    CampaignInput:
      type: object
      additionalProperties: false
      required: [name, segment, template_name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        segment: { type: string, enum: [all_opted_in, lapsed, regulars] }
        template_name: { type: string }
        offer_text: { type: [string, "null"], maxLength: 120 }
        discount_percent: { type: [integer, "null"], minimum: 1, maximum: 90, description: "% of the bill subtotal" }
        code_prefix: { type: [string, "null"], pattern: '^[A-Z0-9]{2,10}$' }
        valid_until: { type: [string, "null"], format: date-time }

    Campaign:
      allOf:
        - { $ref: "#/components/schemas/CampaignInput" }
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, scheduled, sending, completed, cancelled] }
            scheduled_at: { type: [string, "null"], format: date-time }

    AudiencePreview:
      type: object
      required: [in_segment, excluded, will_receive, daily_limit, days_needed]
      properties:
        in_segment: { type: integer }
        excluded: { type: integer, description: In the segment but not opted in }
        will_receive: { type: integer }
        daily_limit: { type: integer, description: From the number's messaging tier }
        days_needed: { type: integer }
        estimated_cost: { type: [number, "null"], description: "null until prices are tracked" }
        quality: { type: [string, "null"] }
        template_status: { type: string }

    OfferVerdict: { type: string, enum: [eligible, redeemed, expired, campaign_cancelled, not_sent, not_delivered] }

    OfferRedemption:
      type: object
      required: [redeemed_at, channel, discount_paise]
      properties:
        redeemed_at: { type: string, format: date-time }
        channel: { type: string, enum: [table_bill, counter] }
        redeemed_by_name: { type: [string, "null"] }
        order_number: { type: [integer, "null"] }
        table_label: { type: [string, "null"] }
        bill_paise: { type: [integer, "null"] }
        discount_paise: { type: integer }

    OfferCheck:
      type: object
      required: [recipient_id, code, campaign_id, campaign_name, recipient_status, verdict, reason, matched]
      properties:
        recipient_id: { type: string, format: uuid }
        code: { type: string }
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string }
        offer_text: { type: [string, "null"] }
        discount_percent: { type: [integer, "null"] }
        valid_until: { type: [string, "null"], format: date-time }
        sent_at: { type: [string, "null"], format: date-time }
        recipient_status: { type: string, enum: [queued, deferred, sent, delivered, read, held, failed] }
        verdict: { $ref: "#/components/schemas/OfferVerdict" }
        reason: { type: string, description: Safe to show to staff }
        warning: { type: [string, "null"] }
        matched: { type: boolean, description: The code that was searched for }
        redemption: { anyOf: [{ $ref: "#/components/schemas/OfferRedemption" }, { type: "null" }] }

    OfferOpenBill:
      type: object
      required: [table_session_id, table_label, subtotal_paise]
      properties:
        table_session_id: { type: string, format: uuid }
        table_label: { type: string }
        subtotal_paise: { type: integer }
        code: { type: [string, "null"] }

    OfferCustomer:
      type: object
      required: [customer_id, deleted, visits, offers]
      properties:
        customer_id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        first_name: { type: [string, "null"] }
        masked_phone: { type: [string, "null"] }
        deleted: { type: boolean }
        visits: { type: integer }
        last_visit_at: { type: [string, "null"], format: date-time }
        open_bill: { anyOf: [{ $ref: "#/components/schemas/OfferOpenBill" }, { type: "null" }] }
        offers: { type: array, items: { $ref: "#/components/schemas/OfferCheck" } }

    OfferLookup:
      type: object
      required: [query_kind, customers, truncated]
      properties:
        query_kind: { type: string, enum: [name, phone_last4, code] }
        customers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/OfferCustomer" } }
        truncated: { type: boolean }

    CounterRedeemInput:
      type: object
      additionalProperties: false
      required: [code, bill_paise]
      properties:
        code: { type: string, minLength: 3, maxLength: 20 }
        bill_paise: { type: integer, minimum: 100, maximum: 10000000, description: Amount paid before the discount }

    CounterRedemption:
      type: object
      required: [redemption_id, code, channel, campaign_id, campaign_name, customer_id, bill_paise, discount_paise, total_paise, redeemed_at]
      properties:
        redemption_id: { type: string, format: uuid }
        code: { type: string }
        channel: { type: string, enum: [counter] }
        campaign_id: { type: string, format: uuid }
        campaign_name: { type: string }
        offer_text: { type: [string, "null"] }
        discount_percent: { type: [integer, "null"] }
        customer_id: { type: string, format: uuid }
        first_name: { type: [string, "null"] }
        bill_paise: { type: integer }
        discount_paise: { type: integer }
        total_paise: { type: integer, description: "To collect: bill_paise − discount_paise" }
        redeemed_at: { type: string, format: date-time }
        redeemed_by_name: { type: [string, "null"] }

    AuditSeverity: { type: string, enum: [critical, warning, info] }

    AuditCategory: { type: string, enum: [orders, calls, chats, menu, customers, campaigns, offers, team, settings, platform, other] }

    AuditActorRole: { type: string, enum: [shift_manager, manager, owner, platform_admin, staff_via_ai, system] }

    AuditActor:
      type: object
      required: [user_id, name, role, support]
      properties:
        user_id: { type: [string, "null"], format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/AuditActorRole" }
        support: { type: boolean }

    AuditEntry:
      type: object
      required: [id, at, action, label, category, severity, sentence, actor, details, change]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        action: { type: string }
        label: { type: string }
        category: { $ref: "#/components/schemas/AuditCategory" }
        severity: { $ref: "#/components/schemas/AuditSeverity" }
        severity_reason: { type: [string, "null"] }
        sentence: { type: string, description: "Rendered by code; first names only; money as ₹" }
        actor: { $ref: "#/components/schemas/AuditActor" }
        order:
          type: [object, "null"]
          required: [id, number, status]
          properties: { id: { type: string, format: uuid }, number: { type: integer }, status: { $ref: "#/components/schemas/OrderStatus" } }
        customer:
          type: [object, "null"]
          required: [id, name]
          properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } }
        conversation_id: { type: [string, "null"], format: uuid }
        links:
          type: object
          properties:
            campaign_id: { type: string, format: uuid }
            item_id: { type: string, format: uuid }
            table_session_id: { type: string, format: uuid }
            membership_id: { type: string, format: uuid }
            request_id: { type: string, format: uuid }
        details:
          type: array
          items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } }
        change: { type: object, description: "Raw changed fields (ids, codes, counts; never phone numbers or message text)" }

    AuditPage:
      type: object
      required: [entries, next]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next: { type: [string, "null"] }

    AuditFacets:
      type: object
      required: [from, to, total, by_severity, actions, actors, categories]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        total: { type: integer }
        by_severity: { type: object, required: [critical, warning, info], properties: { critical: { type: integer }, warning: { type: integer }, info: { type: integer } } }
        actions: { type: array, items: { type: object, required: [action, label, category, count], properties: { action: { type: string }, label: { type: string }, category: { $ref: "#/components/schemas/AuditCategory" }, count: { type: integer } } } }
        actors: { type: array, items: { type: object, required: [user_id, name, role, count], properties: { user_id: { type: [string, "null"], format: uuid }, name: { type: string }, role: { $ref: "#/components/schemas/AuditActorRole" }, count: { type: integer } } } }
        categories: { type: array, items: { type: object, required: [category, label, count], properties: { category: { $ref: "#/components/schemas/AuditCategory" }, label: { type: string }, count: { type: integer } } } }

    AuditCatalog:
      type: object
      required: [actions, categories, roles, severities]
      properties:
        actions: { type: array, items: { type: object, required: [action, label, category, max_severity, rule], properties: { action: { type: string }, label: { type: string }, category: { $ref: "#/components/schemas/AuditCategory" }, max_severity: { $ref: "#/components/schemas/AuditSeverity" }, rule: { type: string }, filter_only: { type: boolean, description: "order.accept / order.ready / order.serve: filter only, never written" } } } }
        categories: { type: array, items: { type: object, required: [id, label], properties: { id: { $ref: "#/components/schemas/AuditCategory" }, label: { type: string } } } }
        roles: { type: array, items: { type: object, required: [id, label], properties: { id: { $ref: "#/components/schemas/AuditActorRole" }, label: { type: string } } } }
        severities: { type: array, items: { $ref: "#/components/schemas/AuditSeverity" } }

    OrderHistory:
      type: object
      required: [order, events]
      properties:
        order:
          type: object
          required: [id, number, status, source, created_at, total_paise]
          properties:
            id: { type: string, format: uuid }
            number: { type: integer }
            status: { $ref: "#/components/schemas/OrderStatus" }
            source: { type: string }
            table: { type: [string, "null"] }
            customer: { type: [object, "null"], properties: { id: { type: string, format: uuid }, name: { type: [string, "null"] } } }
            created_at: { type: string, format: date-time }
            total_paise: { type: integer }
            cancel_reason_code: { type: [string, "null"] }
            cancel_reason_text: { type: [string, "null"], description: Staff-only text }
            cancelled_by_name: { type: [string, "null"] }
        events:
          type: array
          maxItems: 200
          items:
            type: object
            required: [at, kind, severity, sentence, actor]
            properties:
              at: { type: string, format: date-time }
              kind: { type: string, enum: [status, action, escalation] }
              severity: { $ref: "#/components/schemas/AuditSeverity" }
              severity_reason: { type: [string, "null"] }
              sentence: { type: string }
              actor:
                type: object
                required: [type, name]
                properties: { type: { type: string, enum: [customer, staff, support, ai, system] }, name: { type: string }, role: { type: [string, "null"] } }
              from_status: { anyOf: [{ $ref: "#/components/schemas/OrderStatus" }, { type: "null" }] }
              to_status: { anyOf: [{ $ref: "#/components/schemas/OrderStatus" }, { type: "null" }] }
              audit_id: { type: [string, "null"], format: uuid }
              details: { type: array, items: { type: object, required: [label, value], properties: { label: { type: string }, value: { type: string } } } }
